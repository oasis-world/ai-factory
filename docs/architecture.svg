<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1030" viewBox="0 0 1480 1030" role="img" aria-label="AI Factory 功能结构图">
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2126; font-weight: 700; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6b7078; font-size: 25px; }
      .arrow { stroke: #8c9198; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon { stroke: #1f2126; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="head" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#8c9198" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1440" height="990" rx="40" fill="#ffffff" stroke="#e4e6e8" stroke-width="3"/>

  <!-- AI Factory Manager -->
  <rect x="60" y="56" width="1360" height="206" rx="26" fill="#e8f4f0"/>
  <g transform="translate(712 78)" class="icon">
    <rect x="14" y="10" width="44" height="34" rx="10"/>
    <path d="M36 10 V2 M24 2 H48"/>
    <circle cx="28" cy="26" r="3.5" fill="#1f2126" stroke="none"/>
    <circle cx="44" cy="26" r="3.5" fill="#1f2126" stroke="none"/>
    <path d="M30 37 H42"/>
  </g>
  <text class="t" x="740" y="160" font-size="42" text-anchor="middle">AI Factory Manager</text>
  <text class="s" x="740" y="203" text-anchor="middle">Codex / Claude Code / 本地 Agent</text>
  <text class="s" x="740" y="239" text-anchor="middle">理解任务、拆解任务、分配生产线、检查结果</text>

  <!-- arrow 1 -->
  <path class="arrow" d="M740 284 V314 M724 300 L740 316 L756 300" marker-end="url(#head)"/>

  <!-- Production lines -->
  <rect x="60" y="340" width="440" height="176" rx="24" fill="#e9edfa"/>
  <g transform="translate(252 362)" class="icon">
    <rect x="14" y="12" width="48" height="30" rx="12"/>
    <path d="M26 20 V34 M19 27 H33 M50 24 H54 M50 32 H54"/>
  </g>
  <text class="t" x="280" y="444" font-size="34" text-anchor="middle">Game Factory</text>
  <text class="s" x="280" y="482" text-anchor="middle">SpriteKiln</text>

  <rect x="520" y="340" width="440" height="176" rx="24" fill="#f4ecfb"/>
  <g transform="translate(712 362)" class="icon">
    <rect x="12" y="16" width="52" height="32" rx="5"/>
    <path d="M12 26 H64 M24 16 L30 26 M40 16 L46 26 M56 16 L62 26"/>
  </g>
  <text class="t" x="740" y="444" font-size="34" text-anchor="middle">Video Factory</text>
  <text class="s" x="740" y="482" text-anchor="middle">FlixML / Spool</text>

  <rect x="980" y="340" width="440" height="176" rx="24" fill="#fbf4e6"/>
  <g transform="translate(1172 364)" class="icon">
    <path d="M38 14 C30 8 18 10 14 14 V46 C18 42 30 40 38 46 C46 40 58 42 62 46 V14 C58 10 46 8 38 14 Z"/>
    <path d="M38 14 V46"/>
  </g>
  <text class="t" x="1200" y="444" font-size="34" text-anchor="middle">Comic Factory</text>
  <text class="s" x="1200" y="482" text-anchor="middle">Comic Pipeline</text>

  <!-- arrow 2 -->
  <path class="arrow" d="M740 536 V566 M724 552 L740 568 L756 552" marker-end="url(#head)"/>

  <!-- Workflow engine -->
  <rect x="60" y="610" width="1360" height="146" rx="24" fill="#e9f4f1"/>
  <text class="t" x="740" y="675" font-size="38" text-anchor="middle">ComfyUI + MCP + Workflow Engine</text>
  <text class="s" x="740" y="719" text-anchor="middle">统一模型调用、工作流执行、队列、任务状态、错误重试</text>

  <!-- arrow 3 -->
  <path class="arrow" d="M740 776 V806 M724 792 L740 808 L756 792" marker-end="url(#head)"/>

  <!-- Asset library -->
  <rect x="60" y="825" width="1360" height="146" rx="24" fill="#ffffff" stroke="#e4e6e8" stroke-width="3"/>
  <g transform="translate(712 842)" class="icon">
    <path d="M12 16 H34 L40 23 H64 V48 H12 Z"/>
  </g>
  <text class="t" x="740" y="911" font-size="38" text-anchor="middle">Unified Asset Library</text>
  <text class="s" x="740" y="951" text-anchor="middle">统一素材管理、版本控制、质量审核、元数据、导出</text>
</svg>
